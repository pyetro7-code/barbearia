<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel do dono</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0b0b0d;--ink:#f4efe3;--muted:#a9a396;--gold:#f0b94a;--card:#1a1a1f;--line:#34343c;--err:#ff8a8a}
@media (prefers-color-scheme:light){:root{--bg:#f4efe3;--ink:#1b1608;--muted:#6b6340;--gold:#8a5a00;--card:#fff;--line:#d9d2bd;--err:#b3261e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.45;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.1rem;color:var(--gold);margin:26px 0 10px}
input,select{width:100%;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;background:var(--gold);color:#1b1608;cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--muted)}
button.red{background:transparent;color:var(--err);border:1px solid var(--err);padding:6px 12px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #6fa0ff;outline-offset:2px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.it{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.it.off{opacity:.5;text-decoration:line-through}
.it b{font-size:1.1rem}.it small{display:block;color:var(--muted)}.it a{color:var(--gold)}
.err{color:var(--err)}.muted{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="login">
<h1>Painel do dono</h1><p class="muted">Entre com o e-mail e a senha criados no Supabase.</p>
<input id="em" type="email" placeholder="E-mail" autocomplete="username">
<input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
<p class="err" id="le"></p>
<button id="in">Entrar</button>
</section>

<section id="app" hidden>
<div class="row"><h1>Agenda</h1><button class="sec" id="out">Sair</button></div>
<input id="dia" type="date" aria-label="Dia">
<h2>Agendamentos do dia</h2><div id="list"></div>
<h2>Bloquear horário (folga, feriado, almoço extra)</h2>
<select id="bb" aria-label="Profissional"></select>
<div class="row"><input id="bi" type="time" value="09:00" aria-label="Início"><input id="bf" type="time" value="18:00" aria-label="Fim"></div>
<input id="bm" placeholder="Motivo (opcional)" maxlength="80">
<p class="err" id="be"></p>
<button id="badd">Bloquear</button>
<h2>Bloqueios do dia</h2><div id="blist"></div>
</section>
</main>
<script>
var sb=supabase.createClient("https://cqdejtuvbdswkncsdoii.supabase.co","sb_publishable_JeXNEr9n1M7Pl4aWwrndzA_BvZXCcBq");
var $=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hr(s){return new Date(s).toLocaleTimeString("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit"})}
function range(){var d=$("dia").value;return[d+"T00:00:00-03:00",d+"T23:59:59-03:00"]}
function item(cls){var e=document.createElement("div");e.className="it"+(cls?" "+cls:"");return e}
function txt(parent,tag,t){var e=document.createElement(tag);e.textContent=t;parent.appendChild(e);return e}
function start(){sb.auth.getSession().then(function(r){r.data.session?enter():($("login").hidden=false,$("app").hidden=true)})}
function enter(){$("login").hidden=true;$("app").hidden=false;if(!$("dia").value)$("dia").value=ymd(new Date());
sb.from("barbeiros").select("id,nome").order("nome").then(function(r){var s=$("bb");s.innerHTML="";var o=document.createElement("option");o.value="";o.textContent="Todos os profissionais";s.appendChild(o);
(r.data||[]).forEach(function(b){var x=document.createElement("option");x.value=b.id;x.textContent=b.nome;s.appendChild(x)})});load()}
$("in").addEventListener("click",function(){$("le").textContent="";
sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value}).then(function(r){if(r.error)$("le").textContent="E-mail ou senha incorretos.";else{$("pw").value="";enter()}})});
$("out").addEventListener("click",function(){sb.auth.signOut().then(start)});
$("dia").addEventListener("change",load);
function load(){var rg=range();
sb.from("agendamentos").select("id,inicio,fim,cliente_nome,cliente_telefone,status,barbeiros(nome),servicos(nome)").gte("inicio",rg[0]).lte("inicio",rg[1]).order("inicio").then(function(r){
var l=$("list");l.innerHTML="";if(r.error){txt(l,"p","Erro ao carregar. Entre de novo.").className="err";return}
if(!r.data.length)txt(l,"p","Nenhum agendamento neste dia.").className="muted";
r.data.forEach(function(a){var e=item(a.status==="cancelado"?"off":""),L=document.createElement("div");
txt(L,"b",hr(a.inicio)+" às "+hr(a.fim)+" · "+a.cliente_nome);
txt(L,"small",(a.servicos?a.servicos.nome:"")+" · "+(a.barbeiros?a.barbeiros.nome:""));
var s=txt(L,"small","");var w=document.createElement("a");w.href="https://wa.me/55"+a.cliente_telefone;w.target="_blank";w.rel="noopener";w.textContent=a.cliente_telefone;s.appendChild(w);e.appendChild(L);
if(a.status==="confirmado"){var b=txt(e,"button","Cancelar");b.className="red";b.addEventListener("click",function(){if(confirm("Cancelar o horário de "+a.cliente_nome+"?"))sb.from("agendamentos").update({status:"cancelado"}).eq("id",a.id).then(load)})}
l.appendChild(e)})});
sb.from("bloqueios").select("id,inicio,fim,motivo,barbeiros(nome)").gte("fim",rg[0]).lte("inicio",rg[1]).order("inicio").then(function(r){
var l=$("blist");l.innerHTML="";if(!r.data||!r.data.length){txt(l,"p","Nenhum bloqueio neste dia.").className="muted";return}
r.data.forEach(function(x){var e=item(),L=document.createElement("div");txt(L,"b",hr(x.inicio)+" às "+hr(x.fim));txt(L,"small",(x.barbeiros?x.barbeiros.nome:"Todos")+(x.motivo?" · "+x.motivo:""));e.appendChild(L);
var b=txt(e,"button","Remover");b.className="red";b.addEventListener("click",function(){sb.from("bloqueios").delete().eq("id",x.id).then(load)});l.appendChild(e)})})}
$("badd").addEventListener("click",function(){var d=$("dia").value,i=$("bi").value,f=$("bf").value;$("be").textContent="";
if(!d||!i||!f||f<=i){$("be").textContent="Confira o dia e os horários (o fim deve ser depois do início).";return}
sb.from("bloqueios").insert({barbeiro_id:$("bb").value||null,inicio:d+"T"+i+":00-03:00",fim:d+"T"+f+":00-03:00",motivo:$("bm").value.trim()||null}).then(function(r){if(r.error)$("be").textContent="Não foi possível bloquear.";else{$("bm").value="";load()}})});
start();
</script>
</body>
</html>
